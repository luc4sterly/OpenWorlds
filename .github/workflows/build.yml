# Build, tests, packages and releases of OpenWorlds and J Solar Server.
#
# - build (Linux): builds the original client with the bridge (and the
#   formats/ readers), the launcher with the J Worlds Injector, and J Solar
#   Server; runs tools/run-checks.sh and tools/verify-corpus.sh; starts the
#   packaged original client under Xvfb (smoke tests: it has to draw, alone
#   and connected over TLS to the packaged J Solar Server with patches
#   built in); leaves the portable packages (.zip, need Java 17+) and the
#   Linux apps with their own Java (.tar.gz).
# - package: the apps with their own Java for macOS (Intel and Apple
#   Silicon) and Windows, from the same build.
# - release: every push to main (the default branch) publishes a GitHub
#   release, tag v1.0.<commits>, with every package and SHA256SUMS.txt; the
#   launcher's updater (Updater) finds it there. A v* tag pushed by hand is
#   published too. From another branch: Actions > build > Run workflow >
#   "prerelease" publishes a test version (v1.0.<commits>-pre.<run>) that
#   only players who tick "test versions" in Settings get.
#
# Each run's packages are also on the run's page (Artifacts).
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish this run as a test version (prerelease) in Releases"
        type: boolean
        default: false

# On main a run is never cancelled half-way: it could be publishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Linux - build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # rev-list --count for the version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb patch zip

      # 1.0.<commits> (base in launcher/VERSION); with a v* tag, the tag's; in
      # a prerelease by hand, 1.0.<commits>-pre.<run>. It is the version the
      # updater compares, so it is the same in the tag and inside the jars.
      - name: Version
        id: v
        run: |
          base="$(tr -d ' \r\n' < launcher/VERSION)"
          count="$(git rev-list --count HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.prerelease }}" = true ]; then
            version="$base.$count-pre.$GITHUB_RUN_NUMBER"
          else
            version="$base.$count"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "OpenWorlds $version ($(git rev-parse --short HEAD))"

      - name: Portable packages + Linux apps
        env:
          OPENWORLDS_VERSION: ${{ steps.v.outputs.version }}
          OPENWORLDS_NUMERIC_VERSION: ${{ steps.v.outputs.numeric }}
          OPENWORLDS_COMMIT: ${{ steps.v.outputs.commit }}
        run: tools/build-dist.sh --app-image

      - name: Unit checks (formats, bridge, injector, launcher, server)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" tools/run-checks.sh

      - name: Corpus (.seq, .bod, .cmp, .mov)
        run: tools/verify-corpus.sh --no-checks

      - name: Smoke test - the packaged original client draws
        env:
          OPENWORLDS_DATA: ${{ runner.temp }}/openworlds-data
        run: xvfb-run -a -s "-screen 0 1280x1024x24" build/app/OpenWorlds/bin/OpenWorlds --smoke 120

      # The packaged J Solar Server with TLS, and the packaged client online
      # over TLS (its certificate trusted on the command line) with two
      # patches: the J Worlds Injector must build them and the client connect.
      - name: Smoke test - the client connects to J Solar Server, encrypted and patched
        env:
          OPENWORLDS_DATA: ${{ runner.temp }}/openworlds-data-online
        run: |
          set -euo pipefail
          SOLAR_LOG="$RUNNER_TEMP/j-solar-server.log"
          build/app/JSolarServer/bin/JSolarServer --headless --tls --data "$RUNNER_TEMP/j-solar-server" \
            > "$SOLAR_LOG" 2>&1 < /dev/null &
          SOLAR=$!
          trap 'kill $SOLAR 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            grep -q "\] ready:" "$SOLAR_LOG" && break
            sleep 1
          done
          cat "$SOLAR_LOG"
          xvfb-run -a -s "-screen 0 1280x1024x24" build/app/OpenWorlds/bin/OpenWorlds --smoke 150 \
            --server 127.0.0.1 --encrypted --trust --user SmokeTest --password smoke-test --patches vip,chat-time
          cat "$SOLAR_LOG"

      - name: Smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            ${{ runner.temp }}/openworlds-data/logs
            ${{ runner.temp }}/openworlds-data-online/logs
            ${{ runner.temp }}/j-solar-server.log
          if-no-files-found: ignore

      - name: Upload the portable packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ steps.v.outputs.version }}-portable
          path: |
            build/OpenWorlds-*-portable.zip
            build/JSolarServer-*-portable.zip
          compression-level: 0

      - name: Upload the Linux apps
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ steps.v.outputs.version }}-linux-x64
          path: |
            build/OpenWorlds-*-linux-x64.tar.gz
            build/JSolarServer-*-linux-x64.tar.gz
          compression-level: 0

      - name: Package tree for the other systems
        uses: actions/upload-artifact@v4
        with:
          name: dist-tree
          path: build/dist
          retention-days: 3

    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      commit: ${{ steps.v.outputs.commit }}

  package:
    name: Apps ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: dist-tree
          path: build/dist

      - name: jlink + jpackage
        env:
          OPENWORLDS_VERSION: ${{ needs.build.outputs.version }}
          OPENWORLDS_NUMERIC_VERSION: ${{ needs.build.outputs.numeric }}
          OPENWORLDS_COMMIT: ${{ needs.build.outputs.commit }}
        run: tools/build-dist.sh --package-only

      # The .exe/.app are GUI programs (no console): the tests use the java
      # and the jars of each package to see the output.
      - name: Quick test of the packaged apps
        run: |
          if [ -d build/app/OpenWorlds.app ]; then
            build/app/OpenWorlds.app/Contents/MacOS/OpenWorlds --version
            build/app/OpenWorlds.app/Contents/MacOS/OpenWorlds --paths
            S=build/app/JSolarServer.app/Contents
            "$S/runtime/Contents/Home/bin/java" -jar "$S/app/j-solar-server.jar" --version
          else
            build/app/OpenWorlds/OpenWorlds.exe --version || true
            build/app/JSolarServer/runtime/bin/java.exe -jar build/app/JSolarServer/app/j-solar-server.jar --version
          fi

      - name: Smoke test - the packaged original client draws
        env:
          OPENWORLDS_DATA: ${{ runner.temp }}/openworlds-data
        run: |
          if [ -d build/app/OpenWorlds.app ]; then
            APP=build/app/OpenWorlds.app/Contents
            JAVA="$APP/runtime/Contents/Home/bin/java"
          else
            APP=build/app/OpenWorlds
            JAVA="$APP/runtime/bin/java.exe"
          fi
          "$JAVA" -jar "$APP/app/openworlds-launcher.jar" --smoke 120

      - name: Smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/openworlds-data/logs
          if-no-files-found: ignore

      # Also when the smoke test fails: the apps help to look into it.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ needs.build.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/OpenWorlds-*.zip
            build/JSolarServer-*.zip
            !build/*-portable.zip
          compression-level: 0

  release:
    name: GitHub release
    needs: [build, package]
    if: >-
      (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum OpenWorlds-* JSolarServer-* > SHA256SUMS.txt
          PRE=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            TARGET=""
          else
            TAG="v$VERSION"
            TARGET="--target $GITHUB_SHA"
          fi
          [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          cat > notes.md <<EOF
          OpenWorlds $VERSION (commit \`$COMMIT\`): the original Worlds Chat client (2004) on the portable bridge, and J Solar Server, a world server to play together.

          | System | OpenWorlds (to play) | J Solar Server (to host a world) |
          |---|---|---|
          | macOS Apple Silicon | \`OpenWorlds-$VERSION-macos-arm64.zip\` | \`JSolarServer-$VERSION-macos-arm64.zip\` |
          | macOS Intel | \`OpenWorlds-$VERSION-macos-x64.zip\` | \`JSolarServer-$VERSION-macos-x64.zip\` |
          | Windows | \`OpenWorlds-$VERSION-windows-x64.zip\` | \`JSolarServer-$VERSION-windows-x64.zip\` |
          | Linux | \`OpenWorlds-$VERSION-linux-x64.tar.gz\` | \`JSolarServer-$VERSION-linux-x64.tar.gz\` |
          | Any system with Java 17+ | \`OpenWorlds-$VERSION-portable.zip\` | \`JSolarServer-$VERSION-portable.zip\` |

          The apps bring their own Java. OpenWorlds updates itself from here (Settings > Updates). macOS: the apps are not signed by Apple; the first time, "Open Anyway" in Privacy & Security, or \`xattr -dr com.apple.quarantine OpenWorlds.app\`.
          EOF
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists: its packages are replaced"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber OpenWorlds-* JSolarServer-* SHA256SUMS.txt
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" $TARGET \
              --title "OpenWorlds ${TAG#v}" --notes-file notes.md --generate-notes $PRE \
              OpenWorlds-* JSolarServer-* SHA256SUMS.txt
          fi
