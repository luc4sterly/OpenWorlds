# Build, tests, paquetes y releases de FreeWorlds.
#
# - build (Linux): compila el cliente original con el puente (y los lectores
#   de formats/), el lanzador y whirl (server/whirl, para "whirl local"); pasa
#   tools/run-checks.sh y tools/verify-corpus.sh; arranca el cliente original
#   empaquetado bajo Xvfb, solo y con el whirl de la app (prueba de humo: tiene
#   que dibujar); deja el paquete portable (.zip, necesita Java 17+) y la app
#   de Linux con su propio Java (.tar.gz).
# - package: la app con Java y whirl incluidos para macOS (Intel y Apple
#   Silicon) y Windows, desde el mismo build.
# - release: cada push a main (la rama por defecto) publica una release en
#   GitHub, tag v1.0.<commits>, con todos los paquetes y SHA256SUMS.txt; el
#   actualizador del lanzador (Updater) la encuentra ahi. Un tag v* subido a
#   mano tambien se publica. Desde otra rama: Actions > build > Run workflow
#   > "prerelease" publica una version de prueba (v1.0.<commits>-pre.<run>)
#   que solo reciben quienes marcan "versiones de prueba" en Ajustes.
#
# Los paquetes de cada ejecucion quedan ademas en la pagina del run (Artifacts).
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publicar esta ejecucion como version de prueba (prerelease) en Releases"
        type: boolean
        default: false

# En main no se cancela una ejecucion a medias: podria estar publicando.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  # whirl (Rust, toolchain fijado en server/whirl/rust-toolchain.toml): sin el
  # LTO "fat" de su perfil release, que triplica el tiempo de la CI
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Linux - compilar, probar y empaquetar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # rev-list --count para la version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Paquetes del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb patch zip

      # 1.0.<commits> (base en launcher/VERSION); con un tag v*, el del tag; en
      # una prerelease a mano, 1.0.<commits>-pre.<run>. Es la version que el
      # actualizador compara, asi que va igual en el tag y dentro del jar.
      - name: Version
        id: v
        run: |
          base="$(tr -d ' \r\n' < launcher/VERSION)"
          count="$(git rev-list --count HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.prerelease }}" = true ]; then
            version="$base.$count-pre.$GITHUB_RUN_NUMBER"
          else
            version="$base.$count"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "FreeWorlds $version ($(git rev-parse --short HEAD))"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/whirl

      # Si whirl no compila, la app sale sin el (el lanzador lo dice) y la
      # prueba de humo con whirl falla: se ve en el resumen sin tumbar el resto.
      - name: whirl para la app de Linux
        id: whirl
        continue-on-error: true
        working-directory: server/whirl
        run: cargo build --release --locked

      - name: Paquete portable + app de Linux
        env:
          FREEWORLDS_VERSION: ${{ steps.v.outputs.version }}
          FREEWORLDS_NUMERIC_VERSION: ${{ steps.v.outputs.numeric }}
          FREEWORLDS_COMMIT: ${{ steps.v.outputs.commit }}
        run: tools/build-dist.sh --app-image

      - name: Checks unitarios (formats/test + bridge/test + launcher/test)
        run: xvfb-run -a -s "-screen 0 1280x1024x24" tools/run-checks.sh

      - name: Corpus (.seq, .bod, .cmp, .mov)
        run: tools/verify-corpus.sh --no-checks

      - name: Prueba de humo - el cliente original empaquetado dibuja
        env:
          FREEWORLDS_DATA: ${{ runner.temp }}/freeworlds-data
        run: xvfb-run -a -s "-screen 0 1280x1024x24" build/app/FreeWorlds/bin/FreeWorlds --smoke 120

      - name: Prueba de humo - whirl local (el de la app) y el cliente conectado
        if: steps.whirl.outcome == 'success'
        env:
          FREEWORLDS_DATA: ${{ runner.temp }}/freeworlds-data-whirl
        run: xvfb-run -a -s "-screen 0 1280x1024x24" build/app/FreeWorlds/bin/FreeWorlds --smoke 120 --server 127.0.0.1:6650

      - name: Registros de las pruebas de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            ${{ runner.temp }}/freeworlds-data/logs
            ${{ runner.temp }}/freeworlds-data-whirl/logs
          if-no-files-found: ignore

      - name: Subir el paquete portable
        uses: actions/upload-artifact@v4
        with:
          name: FreeWorlds-${{ steps.v.outputs.version }}-portable
          path: build/FreeWorlds-*-portable.zip
          compression-level: 0

      - name: Subir la app de Linux
        uses: actions/upload-artifact@v4
        with:
          name: FreeWorlds-${{ steps.v.outputs.version }}-linux-x64
          path: build/FreeWorlds-*-linux-x64.tar.gz
          compression-level: 0

      - name: Arbol del paquete para los demas sistemas
        uses: actions/upload-artifact@v4
        with:
          name: dist-tree
          path: build/dist
          retention-days: 3

    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      commit: ${{ steps.v.outputs.commit }}

  package:
    name: App ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: dist-tree
          path: build/dist

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/whirl

      # En Windows, ntapi 0.3 (de sysinfo 0.23, dependencia de whirl) no
      # compila desde Rust 1.69: referencias a campos empaquetados sin alinear
      # pasaron de aviso a error. Sin tocar whirl: un nightly anterior, y
      # --cap-lints porque whirl_server niega un lint (non_local_definitions)
      # que ese compilador aun no conoce.
      - name: whirl para esta app
        continue-on-error: true
        working-directory: server/whirl
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            rustup toolchain install nightly-2023-01-20 --profile minimal
            RUSTFLAGS="--cap-lints warn" cargo +nightly-2023-01-20 build --release --locked
          else
            cargo build --release --locked
          fi

      - name: jlink + jpackage
        env:
          FREEWORLDS_VERSION: ${{ needs.build.outputs.version }}
          FREEWORLDS_NUMERIC_VERSION: ${{ needs.build.outputs.numeric }}
          FREEWORLDS_COMMIT: ${{ needs.build.outputs.commit }}
        run: tools/build-dist.sh --package-only

      - name: Prueba rapida del lanzador empaquetado
        run: |
          if [ -d build/app/FreeWorlds.app ]; then
            build/app/FreeWorlds.app/Contents/MacOS/FreeWorlds --version
            build/app/FreeWorlds.app/Contents/MacOS/FreeWorlds --paths
          else
            build/app/FreeWorlds/FreeWorlds.exe --version || true
          fi

      # El .exe/.app son de interfaz grafica (sin consola): la prueba de humo
      # usa el java y los jars del propio paquete para ver la salida. Pasa en
      # los tres sistemas desde la ejecucion #5, asi que ya es obligatoria.
      - name: Prueba de humo - el cliente original empaquetado dibuja
        env:
          FREEWORLDS_DATA: ${{ runner.temp }}/freeworlds-data
        run: |
          if [ -d build/app/FreeWorlds.app ]; then
            APP=build/app/FreeWorlds.app/Contents
            JAVA="$APP/runtime/Contents/Home/bin/java"
          else
            APP=build/app/FreeWorlds
            JAVA="$APP/runtime/bin/java.exe"
          fi
          "$JAVA" -jar "$APP/app/freeworlds-launcher.jar" --smoke 120

      - name: Registro de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/freeworlds-data/logs
          if-no-files-found: ignore

      # Tambien si la prueba de humo falla: la app sirve para investigarlo.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeWorlds-${{ needs.build.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/FreeWorlds-*.zip
            !build/FreeWorlds-*-portable.zip
          compression-level: 0

  release:
    name: Release en GitHub
    needs: [build, package]
    if: >-
      (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: FreeWorlds-*
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum FreeWorlds-* > SHA256SUMS.txt
          PRE=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            TARGET=""
          else
            TAG="v$VERSION"
            TARGET="--target $GITHUB_SHA"
          fi
          [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          cat > notes.md <<EOF
          FreeWorlds $VERSION (commit \`$COMMIT\`): el cliente original de Worlds Chat (2004) con el puente portable.

          | Sistema | Paquete |
          |---|---|
          | macOS Apple Silicon | \`FreeWorlds-$VERSION-macos-arm64.zip\` |
          | macOS Intel | \`FreeWorlds-$VERSION-macos-x64.zip\` |
          | Windows | \`FreeWorlds-$VERSION-windows-x64.zip\` |
          | Linux | \`FreeWorlds-$VERSION-linux-x64.tar.gz\` |
          | Cualquier sistema con Java 17+ | \`FreeWorlds-$VERSION-portable.zip\` |

          Las apps llevan su propio Java y whirl para jugar en "whirl local". El lanzador se actualiza solo desde aqui (Ajustes > Actualizaciones). macOS: la app no esta firmada por Apple; la primera vez, "Abrir igualmente" en Privacidad y seguridad, o \`xattr -dr com.apple.quarantine FreeWorlds.app\`.
          EOF
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe: se reponen sus paquetes"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber FreeWorlds-* SHA256SUMS.txt
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" $TARGET \
              --title "FreeWorlds ${TAG#v}" --notes-file notes.md --generate-notes $PRE \
              FreeWorlds-* SHA256SUMS.txt
          fi
